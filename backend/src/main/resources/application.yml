spring:
  application:
    name: portfolio-tracker
  datasource:
    url: jdbc:postgresql://localhost:5432/portfolio_tracker
    username: portfolio
    password: portfolio
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

finnhub:
  base-url: https://finnhub.io/api/v1
  api-key: ${FINNHUB_API_KEY:demo}
  poll-interval-ms: 60000
